      --toggle-active-fg: #324d79;
    }
  }

  :root[data-theme="dark"] {

    --fg: #FFFFFF;
    --fg-muted: #dbe8f9;
    --card-bg: #456291;

  body {

  }

  main {

  header {

  }

  :root[data-theme="dark"] .logo-dark { display: block; }

  @media (prefers-color-scheme: dark) {

  }

    color: var(--fg-muted);

  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .section-card {
    display: flex;
    align-items: stretch;
    width: 100%;
  }

  .section-edge {
    flex-shrink: 0;
    width: 16px;
    background-image: var(--edge-dot);
    background-repeat: repeat-y;
    background-size: 16px 16px;
  }

  .section-edge.left {
    transform: scaleX(-1);
  }

  .section-body {
    flex: 1 1 0%;
    min-width: 0;
    background: var(--card-bg);
    padding: 16px 10px;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    gap: 12px;
  }

  .group-heading {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.96px;
    text-transform: uppercase;
    text-align: center;
    color: var(--section-heading-color);
  }

  .wave-divider {
    width: 100%;
    height: 6px;
    overflow: hidden;
    color: var(--divider-color);
  }

  .wave-divider svg {
    display: block;
    width: 608px;
    height: 6px;
    max-width: none;
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    width: 100%;
    border-radius: 4px;
    text-decoration: none;
    color: var(--fg);
  }

  .row:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .row-text {
    display: flex;
    flex-direction: column;
    gap: 0;
    min-width: 0;
  }

  .row-title {
    font-family: 'Garamond Premier Pro', 'EB Garamond', Garamond, serif;
    font-size: 18px;
    line-height: 1.3;
    color: var(--fg);
    text-decoration: none;
    transition: color 0.15s ease;
  }

  .row-subcopy {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 13px;
    line-height: 1.3;
    color: var(--fg-muted);
    transition: color 0.15s ease;
  }

  .row:hover .row-title,
  .row:focus-visible .row-title {
    color: var(--row-hover-color);
    text-decoration: underline;
  }

  .row:hover .row-subcopy,
  .row:focus-visible .row-subcopy {
    color: var(--row-hover-color);
  }

  .row-arrow {
    flex-shrink: 0;
    width: 16px;
    height: 16px;
    color: var(--row-arrow-color);
    transition: transform 0.15s ease, color 0.15s ease;
  }

  .row:hover .row-arrow,
  .row:focus-visible .row-arrow {
    color: var(--row-hover-color);
  }

  .row:hover .row-arrow {
    transform: translateX(3px);
  }

  #theme-toggle {
    position: fixed;
    bottom: 1rem;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    background: var(--bg);
    border: 1.5px solid var(--heading-accent);
    transition: background 0.3s, border-color 0.3s;
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
  }

  #theme-toggle button {
    padding: 0 0.85rem;
    height: 28px;
    border-radius: 999px;
    border: none;
    background: none;
    color: var(--heading-accent);
    font-family: inherit;
    font-size: inherit;
    cursor: pointer;
    transition: background 0.3s, color 0.3s;
    user-select: none;
  }

  #theme-toggle button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  #theme-toggle button.active {
    background: var(--toggle-active-bg);
    color: var(--toggle-active-fg);
  }

  @media (prefers-reduced-motion: reduce) {
    body, .row-title, .row-subcopy, .row-arrow, #theme-toggle, #theme-toggle button { transition: none; }

<div id="theme-toggle" role="group" aria-label="Color theme">
  <button id="opt-light" aria-pressed="false">Light</button>
  <button id="opt-dark" aria-pressed="true" class="active">Dark</button>
</div>

<script>
  const root = document.documentElement;
  const optLight = document.getElementById('opt-light');
  const optDark  = document.getElementById('opt-dark');

  function isDark() {
    if (root.dataset.theme) return root.dataset.theme === 'dark';
    return window.matchMedia('(prefers-color-scheme: dark)').matches;
  }

  function applyTheme(dark) {
    root.dataset.theme = dark ? 'dark' : 'light';
    optLight.classList.toggle('active', !dark);
    optDark.classList.toggle('active', dark);
    optLight.setAttribute('aria-pressed', String(!dark));
    optDark.setAttribute('aria-pressed', String(dark));
    localStorage.setItem('theme', dark ? 'dark' : 'light');
  }

  const saved = localStorage.getItem('theme');
  applyTheme(saved ? saved === 'dark' : isDark());

  optLight.addEventListener('click', () => applyTheme(false));
  optDark.addEventListener('click',  () => applyTheme(true));

  // Snap each section card's height to a multiple of 16px so the
  // repeating edge-dot border always ends on a full tile.
  const EDGE_DOT_SIZE = 16;
  const sectionBodies = document.querySelectorAll('.section-body');

  function snapSectionHeights() {
    sectionBodies.forEach(body => { body.style.height = 'auto'; });
    sectionBodies.forEach(body => {
      const natural = body.offsetHeight;
      const snapped = Math.ceil(natural / EDGE_DOT_SIZE) * EDGE_DOT_SIZE;
      body.style.height = snapped + 'px';
    });
  }

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(snapSectionHeights, 150);
  });

  snapSectionHeights();
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(snapSectionHeights);
  }
</script>
